<!-- Header -->
<div class="gsphomeheader gsp-page-header">
  <div class="container gsptextinimage_pos">
    <div class="row">
      <div class="col-md-8">
        <img class="gspheaderimage" src="../../assets/images/gs_logo_home_kontakt.png" alt="GSP Legal Logo">
      </div>
      <div class="col-md-2"></div>
    </div>
  </div>
</div>

<!-- Page Content -->
<div class="gsp-home-tiles gsp-page-content">
  <div class="row gsp-home-grid">
    <!-- Team -->
    <div class="col-xl-3 col-md-3 gspcolimagecenter">
      <div class=" border-0 ">
        <a routerLink="../team">
          <div class=" text-center">
            <img class="gspcardimage" src="../../assets/images/klein/team.jpg">
            <div class="gspcardtext">
              <span> {{'TEAM' | translate | uppercase}}</span>
            </div>
          </div>
        </a>
      </div>
    </div>
    <!-- TAETIGKEITSBEREICH -->
    <div class="col-xl-3 col-md-3 gspcolimagecenter">
      <div class=" border-0 ">
        <a routerLink="../taetigkeitsbereich">
          <div class=" text-center">
            <img class="gspcardimage" src="../../assets/images/klein/taetigkeitsbereiche_mergers.jpg" alt="...">
            <div class="gspcardtext">
              <span> {{'TAETIGKEITSBEREICH' | translate | uppercase}}</span>
            </div>
          </div>
        </a>
      </div>
    </div>
    <!-- International -->
    <div class="col-xl-3 col-md-3 gspcolimagecenter">
      <div class=" border-0 ">
        <a routerLink="../international">
          <div class=" text-center">
            <img class="gspcardimage" src="../../assets/images/klein/international_global.jpg" alt="...">
            <div class="gspcardtext">
              <span> {{'INTERNATIONAL' | translate | uppercase}}</span>
            </div>
          </div>
        </a>
      </div>
    </div>
    <!-- Kontakt -->
    <div class="col-xl-3 col-md-3 gspcolimagecenter">
      <div class="border-0 ">
        <a routerLink="../kontakt">
          <div class="text-center">
            <img class="gspcardimage" src="../../assets/images/klein/kontakt.jpg" alt="...">
            <div class="gspcardtext">
              <span> {{'KONTAKT' | translate | uppercase}}</span>
            </div>
          </div>
        </a>
      </div>
    </div>
  </div>
  <!-- /.row -->

  <!-- /.container -->
</div>
<div class="gspparagraph gspparagraphBGColor gsp-page-content">
  <div class="gsp-home-text">
    <p class="gsphometitlefont">{{'HOMEHEAD' | translate}} </p>
    <p [innerHTML] = "'HOMEP1' | translate"> </p>
    <p [innerHTML] = "'HOMEP2' | translate"> </p>
    <p [innerHTML] = "'HOMEP3' | translate"> </p>
    <p [innerHTML] = "'HOMEP4' | translate"> </p>
    <p [innerHTML] = "'HOMEP5' | translate"> </p>
  </div>
</div>
